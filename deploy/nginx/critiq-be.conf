# Reference template — copy manually to /etc/nginx/sites-available/ on the
# VPS (not run as a container: this Nginx also proxies to the FE, which is
# deployed separately from this repo's docker-compose.yml).
#
# Outdated (30 Oct 2026): this template still listens on plain HTTP for
# Cloudflare "Flexible" mode. The VPS now terminates TLS itself with a
# Cloudflare Origin CA certificate (/etc/ssl/cloudflare/), so the live site
# config there listens on 443 and is the reference, not this file. Flexible
# leaves the Cloudflare → origin hop unencrypted, including session cookies;
# do not go back to it.

server {
    listen 80;
    server_name critiq-dev.web.id;

    location /api/v1 {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare -> this VPS is plain HTTP even though the original
        # client request was HTTPS to Cloudflare — without this, anything
        # in the app inspecting req.protocol would wrongly assume the whole
        # chain is HTTP.
        proxy_set_header X-Forwarded-Proto https;
    }

    # FE (critiq-fe) is deployed separately from this compose setup, by its
    # own docker-compose.yml pulling its own GHCR image. It binds to
    # 127.0.0.1:3000 (loopback only, same as this repo's `app` service) so
    # it is reachable from this Nginx but never directly from the internet —
    # everything must come through Cloudflare and this server block.
    #
    # This is the only server block for critiq-dev.web.id: the FE repo must
    # NOT add a second one for the same server_name. Nginx silently uses the
    # first match and ignores the rest, which shows up as one of the two
    # apps 404ing for no obvious reason.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
